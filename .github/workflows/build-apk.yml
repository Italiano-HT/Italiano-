name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup and Build Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f logo.png ]; then cp logo.png www/logo.png; fi
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          
          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.italiano.garments",
            "appName": "Italiano",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Italiano-App-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
